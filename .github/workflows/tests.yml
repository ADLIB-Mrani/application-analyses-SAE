name: Tests Python et contrôle statique
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Vérifier le JavaScript de la démo
        run: |
          node --check docs/app.js
          node --check docs/browser-api.js
          test -f docs/index.html
          node tests/static_engine.cjs
