# Version Python (Streamlit) : démonstration publique avec données fictives uniquement.
services:
  - type: web
    name: sae-sodebo-python-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-streamlit.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SAE_ALLOW_UPLOAD
        value: "0"
